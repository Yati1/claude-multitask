<!doctype html>
<!--
  The README demo: a recreation of the Claude desktop app's Code tab (dark theme) with
  the three mods at work. Everything drawn is a pure function of the time: render(t),
  t in ms. The storyboard is the data at the top of the script (MSGS, PICKS, MENU,
  SUMMARIES, OPEN, PANE, FILTER, the thought's times, the cursor's PATH). All content is
  made up.

  Open it in a browser to look: ?t=12000 shows one moment, ?play runs it in a loop.
  The app's own font, Anthropic Sans, is read from fonts/ (see fonts.js); without it a
  system font stands in and the text sets a little differently.
-->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:AS;src:url(fonts/AnthropicSans.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:880px;height:580px;background:#151515;overflow:hidden}
#app{--cl:55px;--cw:770px;position:relative;width:880px;height:580px;background:#151515;font-family:AS,'Segoe UI',system-ui,-apple-system,sans-serif;color:#f0efec;font-size:14px;line-height:20px;overflow:hidden}
svg{display:block}

/* top bar */
.ti{position:absolute;top:10px;width:16px;height:16px}
.title{position:absolute;left:162px;top:9px;font-size:13px;font-weight:500;line-height:18px;color:#f0efec;display:flex;align-items:center;gap:6px;white-space:nowrap}
.laptop{position:absolute;left:132px;top:6px;width:24px;height:24px;border-radius:5px;background:#0a2440;display:flex;align-items:center;justify-content:center}
.badge{font-size:12px;font-weight:400;line-height:16px;color:#bfbeb4;background:#2d2d2d;border-radius:5px;padding:2px 6px;margin-left:8px}

/* the transcript's column: --cw wide from --cl, centred in the window, or beside the pane */
.msgs{position:absolute;left:var(--cl);width:var(--cw);top:36px;height:387px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.sec{border:1px solid var(--c);border-radius:8px;padding:8px 8px 10px 13px}
.sec + .sec{margin-top:10px}
.tagrow{height:12px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tag{font-family:'Segoe UI',system-ui,sans-serif;font-weight:600;font-size:9px;line-height:12px;letter-spacing:.4px;color:var(--c);text-transform:uppercase}
/* a tag's buttons: its move picker's ▾ beside it, its filter button at the line's far end */
.tagbox{display:flex;align-items:center;white-space:nowrap}
.tb{font-size:12px;line-height:18px;color:#85847e;padding:0 4px}
.tf{font-size:12px;line-height:18px;color:#85847e;padding:0 4px}
.shead{height:18px;display:flex;align-items:center;justify-content:space-between}
.sec .txt{margin-top:1px}
.umsg{display:flex;flex-direction:column;align-items:flex-end}
.utags{position:relative;align-self:stretch;height:18px;display:flex;justify-content:flex-end;align-items:center;margin-bottom:1px}
.utags .tf{position:absolute;top:0;padding-left:0}
.bub{position:relative;background:#212121;border-radius:10px;padding:8px 12px;max-width:85%}
.hov{height:26px}
.status{color:#898781;display:flex;align-items:center;gap:4px}
.relay{color:#898781}
.chip{position:absolute;width:30px;height:20px}

/* band: its controls, then the picked thread's summary */
.band{position:absolute;left:var(--cl);width:var(--cw);top:437px;height:62px;background:#212121;border-radius:8px}
.brow{position:absolute;left:8px;right:8px;top:10px;height:22px;display:flex;align-items:center;gap:8px}
.tint{height:21px;border-radius:4px;display:flex;align-items:center;padding-left:4px;padding-right:2px;flex:none}
.pdot{width:8px;height:8px;border-radius:50%;margin-right:9px;flex:none}
.sel,.field{height:19px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);border-radius:5px;display:flex;align-items:center;font-size:13px;line-height:17px;white-space:nowrap;color:#f0efec;flex:none}
.sel{padding:0 3px 0 5px}
.ibtn{padding:0 5px}
.hot{border-color:rgba(255,255,255,.32)}
.fw{padding:0 6px}
.fdot{width:14px;height:14px;margin:0 3px 0 -2px}
.gap{flex:1}
.sumline{position:absolute;left:12px;right:12px;top:37px;height:18px;font-size:13px;line-height:18px;color:#898781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* prompt */
.prompt{position:absolute;left:var(--cl);width:var(--cw);top:506px;height:40px;border:1px solid #4d4d4c;background:#20201f;border-radius:12px}
.ptext{position:absolute;left:11px;top:9px;right:40px;white-space:nowrap;overflow:hidden;color:#f0efec}
.pcaret{display:inline-block;width:1px;height:17px;background:#f0efec;vertical-align:-3px;margin-left:1px}
.below{position:absolute;left:var(--cl);width:var(--cw);top:553px;height:20px;font-size:12px;line-height:20px}

/* pane */
.pane{position:absolute;left:516px;top:40px;width:356px;height:532px;border:1px solid #2a2a2a;background:#1a1a19;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.45);overflow:hidden}
.tab{position:absolute;top:4px;height:24px;border-radius:6px;font-size:13px;line-height:24px;padding:0 8px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.pbody{position:absolute;left:12px;right:16px;top:36px;bottom:52px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;font-size:13px;line-height:19px}
.pdiv{position:absolute;left:12px;right:16px;bottom:42px;height:1px;background:#3b3b3a}
.filters{position:absolute;left:12px;right:16px;bottom:13px;height:19px;display:flex;align-items:center;gap:8px}
.fsw{height:19px;border:1px solid transparent;border-radius:10px;padding:0 8px;display:flex;align-items:center}
.psec{border:1px solid var(--c);border-radius:8px;padding:7px 10px 11px 8px}
.psec .txt{margin-top:1px}
.pusr{display:flex;flex-direction:column;align-items:flex-end}
.pusr .tagrow{margin-bottom:1px}
.pbub{position:relative;background:#252524;border-radius:10px;padding:10px 16px;max-width:88%}
.pgap{height:18px;flex:none}

/* floating things */
.menu{position:absolute;background:#262625;border:1px solid #3a3a39;border-radius:8px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.5);font-size:13px;line-height:18px;width:150px}
.mi{height:28px;border-radius:5px;padding:0 8px;display:flex;align-items:center;justify-content:space-between;color:#f0efec}
.mi.dim{color:#c3c2b7}
.mi.on{background:#363635}
.mi svg{flex:none}
.tabx{display:flex;align-items:center;justify-content:center;width:16px;height:16px;margin:0 -4px 0 -4px;border-radius:4px}
.tabx.on{background:#555554}
.card{position:absolute;background:#262625;border:1px solid #3a3a39;border-radius:8px;padding:8px 11px 9px;box-shadow:0 6px 20px rgba(0,0,0,.5);font-size:13px;line-height:18px;white-space:nowrap}
/* a tag's buttons lit in its colour under the pointer; a button's tip, one line high, on
   the button's own line toward the line's middle */
.tb.lit,.tf.lit{color:var(--c)}
.tf.open{position:relative}
.tip{position:absolute;right:100%;top:0;height:18px;background:#262625;border:1px solid #3a3a39;border-radius:6px;padding:0 6px;font-size:12px;line-height:16px;color:#f0efec;white-space:nowrap}
.cursor{position:absolute;width:13px;height:20px;pointer-events:none}
</style></head>
<body><div id="app"></div>
<script>
// ---------------------------------------------------------------- data
const TH = {
  design: { name: 'Design', color: '#4fa3e0' },
  bugs:   { name: 'Bugs',   color: '#d9636a' },
  docs:   { name: 'Docs',   color: '#58b36b' },
};
const ORDER = ['design', 'bugs', 'docs'];
// multitask colours a thought from a palette of its own; amber keeps it apart from the threads
const THOUGHT = { name: 'Test run', color: '#c98a2e' };

// The window is 880px wide; the transcript, band and prompt keep to a column 770px wide
// in its middle, as the app's do, or beside the pane while it is open.
const COL = { left: 55, width: 770 };
const COL_BESIDE_PANE = { left: 18, width: 472 };

// Every message, with when it appears (ms). Replies stream from start to end.
const MSGS = [
  { role: 'user', th: 'bugs', text: 'The cooking timer resets when I switch tabs', at: -1 },
  { role: 'reply', at: -1, secs: [{ th: 'bugs', text: 'Fixed: the timer now keeps counting while its tab is in the background.', start: -1, end: -1 }] },
  { role: 'user', th: 'docs', text: 'Add a quick start section to the README', at: -1 },
  { role: 'reply', at: -1, secs: [{ th: 'docs', text: 'Added a Quick start section to the README: clone, install and run the app in three commands.', start: -1, end: -1 }] },
  { role: 'user', th: 'design', text: 'Make the recipe cards more compact', typed: '# Design Make the recipe cards more compact', type: [600, 1800], at: 1950 },
  { role: 'reply', at: 2150, secs: [{ th: 'design', text: 'Done: the cards have tighter padding and show the cook time beside the title, so four fit in a row.', start: 2150, end: 2800 }] },
  { role: 'user', th: 'bugs', text: 'Search misses titles with capitals. Fix it and note it in the docs', type: [6600, 8000], at: 8150 },
  { role: 'status', text: 'Used 3 tools', at: 8400 },
  { role: 'reply', at: 8600, secs: [
    { th: 'bugs', text: 'Fixed: search now ignores case, and a new test covers it.', start: 8600, end: 9000 },
    { th: 'docs', text: 'Added the search fix to the changelog.', start: 9100, end: 9400 } ] },
  { role: 'user', th: 'bugs', text: 'Run the whole test suite and fix anything that fails', type: [16200, 17300], at: 17450 },
  { role: 'reply', at: 17650, secs: [{ th: 'bugs', text: 'On it: a thought is running the suite in the background.', start: 17650, end: 18050 }] },
  { role: 'relay', text: '◦ thought update: Test run', at: 23100 },
  { role: 'reply', at: 23300, secs: [{ th: 'bugs', text: 'All 128 tests pass. Two date tests assumed UTC; the parser now keeps the local day.', start: 23300, end: 23900 }] },
  { role: 'user', th: 'bugs', text: 'Great, thanks!', type: [25300, 25750], at: 25900, reactAt: 26400 },
];
const END = 28800;

// Thread the picker posts to, over time.
const PICKS = [[-1, 'docs'], [1950, 'design'], [5900, 'bugs']];
// Menu of the picker: open from..to, hovered item over time.
const MENU = { open: 5000, close: 5900, hot: [[5000, 'design'], [5550, 'bugs']] };
// Each thread's one-line summary over time, shown under the band while it is picked; a
// new one comes a little after a turn in the thread ends.
const SUMMARIES = {
  docs: [[-1, 'The README has a quick start: clone, install and run the app in three commands.']],
  design: [[-1, 'Recipe list layout: spacing, card sizes and the grid.'],
    [3700, 'Recipe cards are compact: tighter padding and the cook time beside the title.']],
  bugs: [[-1, 'The cooking timer keeps counting while its tab is in the background.'],
    [10300, 'Search ignores case now, with a test; the timer keeps counting in background tabs.'],
    [24800, 'All 128 tests pass; the date parser keeps the local day; search ignores case.']],
};
// The filter button `ᯤ` of the thread tag `th` in the reply that appears `at`: hovered
// (the tag's buttons light in its colour and its tip shows) from `hover`, clicked at
// `click`, which opens the thread view on that thread alone.
const OPEN = { at: 8600, th: 'bugs', hover: 11320, click: 12720, tip: 'Show this thread in the thread view' };
// The side pane with the thread view: open from..to. The column moves beside it while it shows.
const PANE = { open: OPEN.click, close: 15550, fade: 150 };
// The thread view's filter, set to the thread from the moment it opens. The tab's close
// button: hovered.
const FILTER = { pick: OPEN.click, th: OPEN.th };
const TABX_HOT = [15300, 15550];
// The thought: start, the rows of its conversation (each blinks its dot), its notes (each
// swells it), end.
const TH_START = 17750;
const BLINKS = [17900, 19200, 20950];
const NOTES = [[18600, 'Running 128 tests'], [20500, 'Two date tests fail; fixing the parser']];
const TH_END = 22800;
const PULSE_MS = 1000, BLINK_MS = 1000, BLINK_PEAK_MS = 250, FADE_MS = 1500;
const CARD = [19100, 22400];

// Cursor path: [t, target, dx, dy] ; target is a selector, '@' and a selector for where
// that was last seen, or [x,y]. Visible spans.
const CURSOR_SPANS = [[4300, 6350], [10800, 15900], [18200, 22800]];
const PATH = [
  [4300, [560, 340]],
  [4950, '#picker-sel', -8, 2],
  [5300, '#picker-sel', -8, 2],
  [5600, '#mi-bugs', -30, 1],
  [5950, '#mi-bugs', -30, 1],
  [6350, [330, 470]],
  [10800, [560, 340]],
  [11320, '#openbtn', 1, 2],
  // held where it pressed: the chat moves from under the pointer as the pane opens
  [11370, '@#openbtn', 1, 2],
  [12770, '@#openbtn', 1, 2],
  // off the view's tags, which show their summaries under the pointer
  [13350, [690, 270]],
  [14850, [690, 270]],
  [15300, '#tabx', 1, 2],
  [15550, '#tabx', 1, 2],
  [15900, [640, 300]],
  [18200, [560, 330]],
  [19100, '#dot0', 2, 3],
  [22400, '#dot0', 2, 3],
  [22800, [640, 380]],
];

// Moments that between them show every colour drawn (menu, the `ᯤ`'s tip, pane, filter,
// the thought's dot, card and check, chip, all threads, the summaries), from which
// encode.js builds the GIF's one palette.
const SAMPLES = [0, 2800, 5700, 9900, 12100, 13020, 14100, 18300, 19350, 22950, 26650];

// ---------------------------------------------------------------- storyboard, in short
//  0.6s  "# Design ..." is typed and sent; the picker follows to Design; the reply
//        streams in under a blue DESIGN section, and Design's summary under the band
//        is written afresh.
//  4.3s  the picker's menu switches to Bugs (its tint turns red); the next message has
//        no heading and goes to Bugs; the reply covers two threads: BUGS and DOCS.
// 10.8s  the `ᯤ` on the reply's BUGS tag (the tag's buttons lit red, its tip: "Show this
//        thread in the thread view") opens the thread view beside the chat, filtered to
//        BUGS, so only Bugs sections show; then its tab is closed.
// 16.2s  a task for a thought, in the chat alone: the voice answers at once; an amber dot
//        appears in the band's `thoughts` button, left of the Multitask dropdown, blinks
//        white at each row of its work and swells at each note, and its hover card shows
//        the latest note; it ends with a check, and the voice reports.
// 25.3s  "Great, thanks!" gets a 👍 reaction on the bubble's corner instead of a reply.

// ---------------------------------------------------------------- helpers
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const easeIO = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
function bez(x1, y1, x2, y2) { // cubic-bezier easing
  return x => { let lo = 0, hi = 1, t = x; for (let i = 0; i < 30; i++) { t = (lo + hi) / 2; const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3; if (cx < x) lo = t; else hi = t; }
    return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3; };
}
const spline = bez(0.42, 0, 0.58, 1);
const splineIn = bez(0.25, 0.1, 0.25, 1);
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, k) => '#' + hex(a).map((v, i) => Math.round(lerp(v, hex(b)[i], k)).toString(16).padStart(2, '0')).join('');
const at = (list, t) => { let v = list[0][1]; for (const [s, x] of list) if (t >= s) v = x; return v; };
// piecewise-linear over [ms, value] steps
const steps = (st, ms) => { if (ms <= st[0][0]) return st[0][1]; for (let i = 1; i < st.length; i++) if (ms <= st[i][0]) { const [a, va] = st[i - 1], [b, vb] = st[i]; return lerp(va, vb, (ms - a) / (b - a)); } return st[st.length - 1][1]; };

const chev = (stroke = '#c3c2b7') => `<svg width="20" height="14" viewBox="-6.86 0 22.86 16"><path d="M4 6l4 4 4-4" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
// a thread's tag, alone (the thread view), or with its buttons (the chat): the move
// picker's ▾ after it and the filter button, which opens the thread view on it alone
const tagSpan = th => `<span class="tag" style="--c:${TH[th].color}">${TH[th].name}</span>`;
const tag = th => `<div class="tagrow">${tagSpan(th)}</div>`;
const FILTER_GLYPH = 'ᯤ';
const movable = (th, lit = false) => `<span class="tagbox">${tagSpan(th)}<span class="tb${lit ? ' lit' : ''}">▾</span></span>`;
const words = (text, k) => { const w = text.split(' '); const n = Math.ceil(clamp(k, 0, 1) * w.length); return w.slice(0, n).join(' '); };
const chipSvg = '<svg width="30" height="20" viewBox="0 0 30 20"><rect x="0.25" y="0.25" width="29.5" height="19.5" rx="9.75" fill="#151515"/><rect x="0.75" y="0.75" width="28.5" height="18.5" rx="9.25" fill="#ffffff14" stroke="#ffffff38"/><text x="15" y="10" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="Segoe UI Emoji, sans-serif">👍</text></svg>';

// A thought's dot, as multitask's band draws it (pictureOf): running, `blink` ms into a
// blink and `swell` ms into a note's swell; or `ms` into its end.
function dotSvg(color, kind, { blink, swell, ms } = {}) {
  const W = '#ffffff';
  const svg = b => `<svg width="14" height="14" viewBox="0 0 14 14">${b}</svg>`;
  if (kind === 'running') {
    let fill = color, r = 3.5;
    if (blink !== undefined && blink < BLINK_MS) fill = mix(color, W, blink < BLINK_PEAK_MS ? splineIn(blink / BLINK_PEAK_MS) : 1 - spline((blink - BLINK_PEAK_MS) / (BLINK_MS - BLINK_PEAK_MS)));
    if (swell !== undefined && swell < PULSE_MS) r = lerp(3.5, 4.7, swell < PULSE_MS / 2 ? spline(swell / (PULSE_MS / 2)) : 1 - spline((swell - PULSE_MS / 2) / (PULSE_MS / 2)));
    return svg(`<circle cx="7" cy="7" r="${r}" fill="${fill}" stroke="${color}" stroke-width="1"/>`);
  }
  // done: a flash, then a check drawn in, then faded
  const fill = mix(color, W, clamp(ms / 150, 0, 1));
  const r = steps([[0, 3.5], [400, 6]], ms), sw = steps([[0, 1], [400, 0]], ms), op = steps([[0, 1], [100, 1], [400, 0]], ms);
  const off = steps([[0, 10], [300, 10], [650, 0]], ms), cop = steps([[0, 1], [FADE_MS - 500, 1], [FADE_MS, 0]], ms);
  return svg(`<circle cx="7" cy="7" r="${r}" fill="${fill}" stroke="${color}" stroke-width="${sw}" opacity="${op}"/>` +
    `<path d="M4 7.3 6.2 9.5 10.2 4.8" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10" stroke-dashoffset="${off}" opacity="${cop}"/>`);
}

const IC = '#c9c8c5';
// thread-chat's band icons, 14px in the theme's text colour
const bandIcon = d => `<svg width="14" height="14" viewBox="0 0 16 16"><path d="${d}" fill="none" stroke="#faf9f5" stroke-width="1.5" stroke-linecap="round"/></svg>`;
const ico = {
  menu: `<svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h8" stroke="${IC}" stroke-width="1.4" stroke-linecap="round"/></svg>`,
  side: `<svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.5" fill="none" stroke="${IC}" stroke-width="1.3"/><path d="M6.5 2.5v11" stroke="${IC}" stroke-width="1.3"/></svg>`,
  back: `<svg width="16" height="16" viewBox="0 0 16 16"><path d="M13 8H3M7 4 3 8l4 4" fill="none" stroke="#7d7c78" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  fwd: `<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="#7d7c78" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  laptop: `<svg width="16" height="16" viewBox="0 0 16 16"><rect x="3" y="3.5" width="10" height="7" rx="1" fill="none" stroke="#5d9ff0" stroke-width="1.4"/><path d="M1.5 12.5h13" stroke="#5d9ff0" stroke-width="1.4" stroke-linecap="round"/></svg>`,
  term: `<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 4.5 6.5 8 3 11.5M8 12h5" fill="none" stroke="${IC}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  diff: `<svg width="16" height="16" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5" fill="none" stroke="${IC}" stroke-width="1.3"/><path d="M8 5v4M6 7h4M6 11h4" stroke="${IC}" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  globe: `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.8" fill="none" stroke="${IC}" stroke-width="1.3"/><path d="M2.2 8h11.6M8 2.2c-2 2-2 9.6 0 11.6M8 2.2c2 2 2 9.6 0 11.6" fill="none" stroke="${IC}" stroke-width="1.2"/></svg>`,
  folder: `<svg width="16" height="16" viewBox="0 0 16 16"><path d="M2 4.5c0-.6.4-1 1-1h3.2l1.5 1.6H13c.6 0 1 .4 1 1V12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z" fill="none" stroke="${IC}" stroke-width="1.3" stroke-linejoin="round"/></svg>`,
  kebab: `<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="3.5" r="1.2" fill="${IC}"/><circle cx="8" cy="8" r="1.2" fill="${IC}"/><circle cx="8" cy="12.5" r="1.2" fill="${IC}"/></svg>`,
  min: `<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8h10" stroke="${IC}" stroke-width="1"/></svg>`,
  max: `<svg width="16" height="16" viewBox="0 0 16 16"><rect x="3.5" y="5" width="7.5" height="7.5" rx="1" fill="none" stroke="${IC}" stroke-width="1"/><path d="M5.5 5V4c0-.5.4-1 1-1H12c.5 0 1 .5 1 1v5.5c0 .6-.5 1-1 1h-1" fill="none" stroke="${IC}" stroke-width="1"/></svg>`,
  close: `<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="${IC}" stroke-width="1"/></svg>`,
  plus: `<svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="${IC}" stroke-width="1.4" stroke-linecap="round"/></svg>`,
  mic: `<svg width="16" height="16" viewBox="0 0 16 16"><rect x="5.8" y="2" width="4.4" height="7.5" rx="2.2" fill="none" stroke="${IC}" stroke-width="1.3"/><path d="M3.8 7.8a4.2 4.2 0 0 0 8.4 0M8 12v2" fill="none" stroke="${IC}" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  ring: `<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="none" stroke="#3a3a3a" stroke-width="2"/><path d="M7 2a5 5 0 0 1 4.6 7" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/></svg>`,
  ret: `<svg width="16" height="16" viewBox="0 0 16 16"><path d="M13 3.5v4.5c0 .6-.4 1-1 1H3.5M6 6 3.5 9 6 12" fill="none" stroke="${IC}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  expand: `<svg width="14" height="14" viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9" fill="none" stroke="${IC}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  x: c => `<svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 1l6 6M7 1 1 7" stroke="${c}" stroke-width="1.2" stroke-linecap="round"/></svg>`,
  rchev: `<svg width="10" height="10" viewBox="0 0 10 10"><path d="M3.5 2 6.5 5 3.5 8" fill="none" stroke="#898781" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  newThread: bandIcon('M8 3v10M3 8h10'),
  view: bandIcon('M2.5 4h11M2.5 8h11M2.5 12h11'),
};
const cursorSvg = '<svg width="13" height="20" viewBox="0 0 13 20"><path d="M0.5 0.5v16.2l3.9-3.7 2.6 6.1 2.6-1.1-2.6-6h5.4z" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-linejoin="round"/></svg>';

// ---------------------------------------------------------------- render
function chatHtml(t) {
  const out = [];
  let prev = null;
  for (const m of MSGS) {
    if (t < m.at) break;
    let gap = 0;
    if (prev) gap = m.role === 'user' ? 30 : prev.role === 'user' ? 0 : prev.role === 'status' || prev.role === 'relay' ? 12 : 16;
    if (m.role === 'user') {
      const chip = m.reactAt !== undefined && t >= m.reactAt;
      const s = chip ? 0.6 + 0.4 * easeIO(clamp((t - m.reactAt) / 180, 0, 1)) : 1;
      // the tags against the right edge; the filter button where the bubble starts at its widest
      out.push(`<div class="umsg" style="margin-top:${gap}px"><div class="utags"><span class="tf" style="left:15%">${FILTER_GLYPH}</span>${movable(m.th)}</div><div class="bub">${esc(m.text)}${chip ? `<div class="chip" style="right:8px;bottom:-10px;transform:scale(${s})">${chipSvg}</div>` : ''}</div><div class="hov"></div></div>`);
    } else if (m.role === 'status') {
      out.push(`<div class="status" style="margin-top:${gap}px">${esc(m.text)} ${ico.rchev}</div>`);
    } else if (m.role === 'relay') {
      out.push(`<div class="relay" style="margin-top:${gap}px">${esc(m.text)}</div>`);
    } else {
      const secs = m.secs.filter(s => t >= s.start).map(s => {
        const k = s.end <= s.start ? 1 : (t - s.start) / (s.end - s.start);
        // the filter button the pointer opens the view from; under it, the tag's buttons
        // light and its tip shows, toward the line's middle
        const open = m.at === OPEN.at && s.th === OPEN.th;
        const hot = open && t >= OPEN.hover && t < OPEN.click;
        const filter = open
          ? `<span class="tf open${hot ? ' lit' : ''}" id="openbtn">${FILTER_GLYPH}${hot ? `<span class="tip">${esc(OPEN.tip)}</span>` : ''}</span>`
          : `<span class="tf">${FILTER_GLYPH}</span>`;
        return `<div class="sec" style="--c:${TH[s.th].color}"><div class="shead">${movable(s.th, hot)}${filter}</div><div class="txt">${esc(words(s.text, k))}</div></div>`;
      });
      out.push(`<div style="margin-top:${gap}px">${secs.join('')}</div>`);
    }
    prev = m;
  }
  return out.join('');
}

function paneHtml(t, picks) {
  const entries = [];
  for (const m of MSGS) {
    if (t < m.at) break;
    if (m.role === 'user') entries.push({ kind: 'u', th: m.th, text: m.text, chip: m.reactAt !== undefined && t >= m.reactAt });
    if (m.role === 'reply') for (const s of m.secs) if (t >= s.end) entries.push({ kind: 'r', th: s.th, text: s.text });
  }
  const shown = entries.filter(e => picks.size === 0 || picks.has(e.th));
  return shown.map((e, i) => {
    const gap = i === 0 ? '' : '<div class="pgap"></div>';
    if (e.kind === 'r') return `${gap}<div class="psec" style="--c:${TH[e.th].color}">${tag(e.th)}<div class="txt">${esc(e.text)}</div></div>`;
    return `${gap}<div class="pusr" style="${e.chip ? 'padding-bottom:12px' : ''}">${tag(e.th)}<div class="pbub">${esc(e.text)}${e.chip ? `<div class="chip" style="right:8px;bottom:-10px">${chipSvg}</div>` : ''}</div></div>`;
  }).join('');
}

function promptState(t) {
  for (const m of MSGS) {
    if (!m.type) continue;
    const [a, b] = m.type;
    const full = m.typed ?? m.text;
    if (t >= a && t < m.at) { const n = Math.round(clamp((t - a) / (b - a), 0, 1) * full.length); return { text: full.slice(0, n), caret: true }; }
  }
  return { text: '', caret: false };
}

// Where each cursor target was last drawn. Frames are rendered in time order, and a
// target is always drawn at some point before the cursor leaves it.
const seen = {};

function render(t) {
  const app = document.getElementById('app');
  const picked = at(PICKS, t);
  const pc = TH[picked].color;
  const menuOpen = t >= MENU.open && t < MENU.close;
  const hot = at(MENU.hot, t);
  const picks = new Set(t >= FILTER.pick ? [FILTER.th] : []);
  const pr = promptState(t);
  const paneOpen = t >= PANE.open && t < PANE.close;
  const col = paneOpen ? COL_BESIDE_PANE : COL;
  app.style.setProperty('--cl', col.left + 'px');
  app.style.setProperty('--cw', col.width + 'px');
  const tabxHot = t >= TABX_HOT[0] && t < TABX_HOT[1];
  const summary = at(SUMMARIES[picked], t);

  // the thought's dot
  let dot = '';
  const running = t >= TH_START && t < TH_END;
  if (running) {
    let blinkAt, noteAt;
    for (const s of BLINKS) if (t >= s) blinkAt = s;
    for (const [s] of NOTES) if (t >= s) noteAt = s;
    dot = dotSvg(THOUGHT.color, 'running', { blink: blinkAt === undefined ? undefined : t - blinkAt, swell: noteAt === undefined ? undefined : t - noteAt });
  } else if (t >= TH_END && t < TH_END + FADE_MS) dot = dotSvg(THOUGHT.color, 'done', { ms: t - TH_END });
  const cardShown = t >= CARD[0] && t < CARD[1] && dot !== '';

  let note; for (const [s, n] of NOTES) if (t >= s) note = n;

  app.innerHTML = `
  <div class="ti" style="left:12px">${ico.menu}</div>
  <div class="ti" style="left:42px">${ico.side}</div>
  <div class="ti" style="left:72px">${ico.back}</div>
  <div class="ti" style="left:100px">${ico.fwd}</div>
  <div class="laptop">${ico.laptop}</div>
  <div class="title">Recipe box polish ${chev('#c3c2b7').replace('width="20"', 'width="16"').replace('-6.86 0 22.86 16', '-2 0 18 16')}<span class="badge">recipe-box</span></div>
  ${['term', 'diff', 'globe', 'folder', 'kebab'].map((k, i) => `<div class="ti" style="left:${590 + i * 28}px">${ico[k]}</div>`).join('')}
  <div class="ti" style="left:758px">${ico.min}</div>
  <div class="ti" style="left:804px">${ico.max}</div>
  <div class="ti" style="left:850px">${ico.close}</div>

  <div class="msgs">${chatHtml(t)}</div>

  <div class="band">
    <div class="brow">
      <div class="tint" style="background:${pc}26"><div class="pdot" style="background:${pc}"></div>
        <div class="sel" id="picker-sel">${TH[picked].name}${chev()}</div></div>
      <div class="field ibtn" id="newbtn">${ico.newThread}</div>
      <div class="field ibtn" id="viewbtn">${ico.view}</div>
      <div class="gap"></div>
      <div class="field${cardShown ? ' hot' : ''}" id="thoughts"><span class="fw">thoughts</span>${dot ? `<span class="fdot" id="dot0">${dot}</span>` : ''}</div>
      <div class="sel">Multitask${chev()}</div>
    </div>
    <div class="sumline">${esc(summary)}</div>
  </div>
  <div class="prompt"><div class="ptext">${esc(pr.text)}${pr.caret ? '<span class="pcaret"></span>' : ''}</div><div style="position:absolute;right:12px;top:11px">${ico.ret}</div></div>
  <div class="below">
    <div style="position:absolute;left:8px;top:2px">${ico.plus}</div>
    <div style="position:absolute;left:29px;top:2px">${ico.mic}</div>
    <div style="position:absolute;left:44px;top:3px">${chev('#8f8f87').replace('width="20"', 'width="14"').replace('-6.86 0 22.86 16', '0 0 16 16')}</div>
    <div style="position:absolute;left:64px;color:#c2beb1">Auto</div>
    <div style="position:absolute;right:76px;color:#efeae5">Opus 5.5</div>
    <div style="position:absolute;right:30px;color:#efeae5">Extra</div>
    <div style="position:absolute;right:6px;top:3px">${ico.ring}</div>
  </div>

  <div class="pane" style="${paneOpen ? `opacity:${clamp((t - PANE.open) / PANE.fade, 0, 1)}` : 'visibility:hidden'}">
    <div class="tab" style="left:5px;background:#3c3c3b;color:#edece9">Thread view <span class="tabx${tabxHot ? ' on' : ''}" id="tabx">${ico.x('#d6d5d2')}</span></div>
    <div style="position:absolute;right:12px;top:11px">${ico.expand}</div>
    <div class="pbody">${paneHtml(t, picks)}</div>
    <div class="pdiv"></div>
    <div class="filters">${ORDER.map(k => {
      const on = picks.has(k);
      const bc = on ? TH[k].color : 'transparent';
      return `<div class="fsw" id="f-${k}" style="border-color:${bc}">${tag(k)}</div>`;
    }).join('')}</div>
  </div>
  ${`<div class="menu" id="menu" style="${menuOpen ? '' : 'visibility:hidden'}">${ORDER.map(k => `<div class="mi${menuOpen && hot === k ? ' on' : ''}" id="mi-${k}">${TH[k].name}${k === 'design' ? '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.6 9.6 3.6" fill="none" stroke="#f0efec" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</div>`).join('')}<div class="mi dim">No thread</div></div>`}
  ${cardShown ? `<div class="card" id="card"><div style="color:${THOUGHT.color};font-weight:700">${THOUGHT.name}</div><div>${note ? esc(note) : '<span style="color:#898781">No notes yet</span>'}</div><div style="color:#898781">just now</div></div>` : ''}
  <div class="cursor" id="cursor" style="display:none">${cursorSvg}</div>`;

  // the picker's menu above the picker; the cards above what they belong to, inside the band
  const band = app.querySelector('.band').getBoundingClientRect();
  const above = (card, anchor) => {
    const a = app.querySelector(anchor).getBoundingClientRect();
    card.style.left = clamp(a.left + a.width / 2 - card.offsetWidth / 2, band.left + 4, band.right - 4 - card.offsetWidth) + 'px';
    card.style.top = (band.top - 6 - card.offsetHeight) + 'px';
  };
  const menu = app.querySelector('#menu');
  const sel = app.querySelector('#picker-sel').getBoundingClientRect();
  menu.style.left = sel.left + 'px'; menu.style.top = (band.top - 4 - menu.offsetHeight) + 'px';
  const card = app.querySelector('#card');
  if (card) above(card, '#dot0');

  // cursor
  const vis = CURSOR_SPANS.some(([a, b]) => t >= a && t <= b);
  if (vis) {
    // a target's centre (plus its offset); one not drawn now, or marked '@', keeps where
    // it was last seen
    const pos = p => {
      if (Array.isArray(p[1])) return p[1];
      const last = p[1].startsWith('@');
      const s = last ? p[1].slice(1) : p[1];
      // (a still rendered out of order may not have seen it: then where it is now)
      const el = last && seen[s] ? null : app.querySelector(s);
      if (el) { const r = el.getBoundingClientRect(); seen[s] = [r.left + r.width / 2, r.top + r.height / 2]; }
      const c = seen[s] ?? [440, 400];
      return [c[0] + (p[2] || 0), c[1] + (p[3] || 0)];
    };
    let i = PATH.findIndex(p => p[0] > t);
    let xy;
    if (i === -1) xy = pos(PATH[PATH.length - 1]);
    else if (i === 0) xy = pos(PATH[0]);
    else { const a = PATH[i - 1], b = PATH[i]; const pa = pos(a), pb = pos(b); const k = easeIO((t - a[0]) / (b[0] - a[0])); xy = [lerp(pa[0], pb[0], k), lerp(pa[1], pb[1], k)]; }
    const c = app.querySelector('#cursor'); c.style.display = 'block'; c.style.left = xy[0] + 'px'; c.style.top = xy[1] + 'px';
  }
}
window.render = render;
window.END = END;
window.SAMPLES = SAMPLES;
window.SIZE = [880, 580];
const q = new URLSearchParams(location.search);
document.fonts.ready.then(() => {
  render(+(q.get('t') ?? 0));
  window.ready = true;
  if (q.has('play')) { const t0 = performance.now(); const tick = () => { render((performance.now() - t0) % END); requestAnimationFrame(tick); }; tick(); }
});
</script></body></html>
